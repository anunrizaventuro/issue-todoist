name = "issue-agent"
main = "src/index.ts"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]

# Non-secret config. Secrets are set with `wrangler secret put <NAME>`:
#   DISCORD_PUBLIC_KEY, LLM_API_KEY, TODOIST_API_TOKEN
# (DISCORD_BOT_TOKEN is only used by scripts/register.ts and is never read by the Worker.)
#
# LLM_BASE_URL is the root of any OpenAI-compatible API, without
# `/chat/completions` — e.g. https://openrouter.ai/api/v1. Empty here means
# reports are filed as raw text instead of being normalized.
#
# The Discord servers allowed to file issues and the Todoist project they file
# into are not secrets and live in src/config.ts.
[vars]
# Produksi memakai provider cloud karena Worker berjalan di edge Cloudflare dan
# tidak bisa menjangkau gateway internal di alamat privat. Untuk pengembangan
# lokal, `.dev.vars` menimpa dua nilai ini, jadi `wrangler dev` tetap memakai
# gateway sendiri tanpa mengubah baris ini.
LLM_BASE_URL = "https://openrouter.ai/api/v1"
LLM_MODEL = "google/gemini-3.7-flash"
# Minutes before an untouched draft files itself. Must stay under 15: the Discord
# interaction token expires then, and the alarm could no longer replace the draft
# card with the result.
REVIEW_TIMEOUT_MINUTES = "10"

[[durable_objects.bindings]]
name = "DRAFTS"
class_name = "IssueDraft"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IssueDraft"]

# Semua console.log/error dari Worker maupun Durable Object disimpan di
# Cloudflare (Workers Logs), bukan cuma lewat begitu saja. Tanpa blok ini
# `wrangler tail` hanya menampilkan log yang kebetulan lewat saat kita
# menonton — sekali putus, jejaknya hilang.
#
# head_sampling_rate = 1 berarti 100% request dicatat. Volume bot ini kecil,
# jadi tidak ada alasan menyampel. Retensi free tier ~3 hari.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
# Catat juga baris ringkasan tiap invocation (status, durasi, outcome), supaya
# request yang mati sebelum sempat nge-log apa pun tetap kelihatan.
invocation_logs = true
